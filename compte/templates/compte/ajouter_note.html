{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="{% static 'compte/style.css' %}">
<title>Ajouter une note</title>
</head>
<body>
<div class="container">
<div class="form">
<form method="POST" action="{% url 'ajouter_note' %}">
{% csrf_token %}
<h1>AJOUTER UNE NOTE</h1>

{% if messages %}
{% for message in messages %}
<div class="element">{{ message.tags }}, {{ message }}</div>
{% endfor %}
{% endif %}

<label for="etudiant_id">Etudiant_id</label>
<input 
type="text"
name="etudiant_id"
id="etudiant_id"
required
>
<label for="matiere_id">matiere_id</label>
<input 
type="text"
name="matiere_id"
id="matiere_id"
required
>
<label for="note">Note</label>
<input 
type="text"
name="valeur"
id="valeur"
required
>

<button type="submit">Enregistrer</button>
</form>
</div>
</div>
</body>
</html>
